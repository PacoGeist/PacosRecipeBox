# Builds the Android app and publishes it on the GitHub Releases page whenever
# a version tag (like v1.0.1) is pushed. The app's "Check for updates" button
# downloads the .apk attached to the newest release.
name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter test
          flutter build apk --release --target-platform android-arm,android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk RecipeBox-${GITHUB_REF_NAME}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: RecipeBox-*.apk
          generate_release_notes: true
